name: Quellen-Probe

# Diagnose von Hand: fragt die Stellen-Quellen (Arbeitsagentur, EURES) wirklich ab und zeigt, was der Scout sehen würde.
# Braucht keine Secrets, nutzt keine KI, schreibt nichts. Schlägt fehl, wenn keine Quelle antwortet.
on:
  # Jeden Morgen vor dem Worker: Fällt eine Schnittstelle aus, schlägt der Lauf fehl und GitHub schickt eine Mail.
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
    inputs:
      begriffe:
        description: 'Suchbegriffe, mit Komma getrennt'
        type: string
        default: 'Controller,Controlling'
      orte:
        description: 'Orte, mit Komma getrennt'
        type: string
        default: 'Innsbruck,München'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node worker/tools/quellen-probe.mjs "$BEGRIFFE" "$ORTE"
        env:
          BEGRIFFE: ${{ inputs.begriffe || 'Controller,Controlling' }}
          ORTE: ${{ inputs.orte || 'Innsbruck,München' }}
