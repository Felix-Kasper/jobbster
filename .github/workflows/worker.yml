name: Worker

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Suche für alle aktiven Nutzer jetzt planen'
        type: boolean
        default: false
      variante:
        description: 'Suchart zum Testen (leer = Standard)'
        type: string
        default: ''
      modell:
        description: 'Modell für die Suche zum Testen (leer = Standard)'
        type: string
        default: ''
      text:
        description: 'Anschreiben zum Testen: Modell,Aufwand,Denken (zum Beispiel claude-sonnet-5-5,low,aus)'
        type: string
        default: ''
  repository_dispatch:
    types: [auftrag]
  schedule:
    # Jeden Tag 04:30 UTC (05:30 in Wien im Winter): fällige Scout-Läufe für alle aktiven Nutzer
    - cron: '30 4 * * *'
    # Übergang, bis die Datenbank den Worker selbst anstößt: tagsüber alle 30 min nach offenen Aufträgen sehen.
    # Kostet in einem privaten Repo rund 900 der 2.000 Freiminuten pro Monat. Danach diese Zeile löschen.
    - cron: '7,37 6-20 * * *'

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aufträge abarbeiten
        run: |
          node --version
          IFS=, read -r TEXT_MODELL TEXT_AUFWAND TEXT_DENKEN <<< "$TEXT_TEST"
          export TEXT_MODELL TEXT_AUFWAND TEXT_DENKEN
          node worker/worker.mjs ${{ (github.event.schedule == '30 4 * * *' || inputs.plan) && '--plan' || '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCOUT_VARIANTE: ${{ inputs.variante || vars.SCOUT_VARIANTE }}
          SCOUT_MODELL: ${{ inputs.modell }}
          TEXT_TEST: ${{ inputs.text }}
