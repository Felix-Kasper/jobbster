name: Worker

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Suche für alle aktiven Nutzer jetzt planen'
        type: boolean
        default: false
      aufraeumen:
        description: 'Nur prüfen, ob offene Treffer noch online sind (ohne Suche)'
        type: boolean
        default: false
      variante:
        description: 'Suchart zum Testen (leer = Standard)'
        type: string
        default: ''
      modell:
        description: 'Modell für die Suche zum Testen (leer = Standard)'
        type: string
        default: ''
      text:
        description: 'Anschreiben zum Testen: Modell,Aufwand,Denken (zum Beispiel claude-sonnet-5-5,low,aus)'
        type: string
        default: ''
  repository_dispatch:
    types: [auftrag]
  schedule:
    # Nur Reserve. Den pünktlichen Takt macht pg_cron in Supabase (Migration 013, Funktion takt).
    # GitHub startet geplante Läufe oft Stunden zu spät; fällt Supabase aus, holt dieser Lauf trotzdem alles nach.
    # Doppelt läuft nichts: Aufträge werden atomar übernommen, der Zeitplan reiht nur ein, was noch fehlt.
    - cron: '30 4 * * *'
    - cron: '17 */3 * * *'

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aufträge abarbeiten
        run: |
          node --version
          IFS=, read -r TEXT_MODELL TEXT_AUFWAND TEXT_DENKEN <<< "$TEXT_TEST"
          export TEXT_MODELL TEXT_AUFWAND TEXT_DENKEN
          node worker/worker.mjs ${{ (github.event.schedule == '30 4 * * *' || inputs.plan) && '--plan' || (inputs.aufraeumen && '--aufraeumen' || '') }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCOUT_VARIANTE: ${{ inputs.variante || vars.SCOUT_VARIANTE }}
          SCOUT_MODELL: ${{ inputs.modell }}
          TEXT_TEST: ${{ inputs.text }}
