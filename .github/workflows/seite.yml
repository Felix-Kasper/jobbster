name: Seite veröffentlichen

# Baut Landingpage (/) und App (/app/) und legt beides auf den Zweig gh-pages (GitHub Pages).
# Mit eigener Domain: Repo-Variable SEITE_DOMAIN setzen (zum Beispiel jobbster.app), dann liegt alles unter der Wurzel.
on:
  push:
    branches: [main]
    paths: ['app/**', 'landing/**', '.github/workflows/seite.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seite
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOMAIN: ${{ vars.SEITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Pfad bestimmen
        run: |
          if [ -n "$DOMAIN" ]; then echo "BASIS=/" >> "$GITHUB_ENV"; else echo "BASIS=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"; fi
      - name: App bauen
        working-directory: app
        # Impressum und Support-Adresse als Repo-Variablen (Settings → Secrets and variables → Actions → Variables). Fehlt eine, zeigt die App „fehlt noch“.
        env:
          VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          VITE_IMPRESSUM_NAME: ${{ vars.IMPRESSUM_NAME }}
          VITE_IMPRESSUM_ANSCHRIFT: ${{ vars.IMPRESSUM_ANSCHRIFT }}
          VITE_IMPRESSUM_GEWERBE: ${{ vars.IMPRESSUM_GEWERBE }}
          VITE_IMPRESSUM_BEHOERDE: ${{ vars.IMPRESSUM_BEHOERDE }}
          VITE_IMPRESSUM_KAMMER: ${{ vars.IMPRESSUM_KAMMER }}
          VITE_IMPRESSUM_UID: ${{ vars.IMPRESSUM_UID }}
        run: |
          npm ci
          VITE_BASE="${BASIS}app/" npm run build
      - name: Landingpage bauen und zusammenlegen
        run: |
          python3 landing/build.py
          mkdir -p _seite/app
          cp landing/index.html _seite/index.html
          cp -r app/dist/. _seite/app/
          # GitHub Pages kennt kein Umschreiben: Unbekannte Pfade (zum Beispiel /app/treffer) liefern 404.html, und das ist die App
          cp app/dist/index.html _seite/404.html
          cp app/public/favicon.svg _seite/favicon.svg 2>/dev/null || true
          touch _seite/.nojekyll
          if [ -n "$DOMAIN" ]; then echo "$DOMAIN" > _seite/CNAME; fi
      - name: Auf gh-pages legen
        run: |
          cd _seite
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Seite aus ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Erreichbarkeit prüfen
        continue-on-error: true
        run: |
          if [ -n "$DOMAIN" ]; then ZIEL="https://$DOMAIN"; else ZIEL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"; fi
          for i in $(seq 1 18); do
            A=$(curl -s -o /dev/null -w "%{http_code}" "$ZIEL/"); B=$(curl -s -o /dev/null -w "%{http_code}" "$ZIEL/app/anmelden")
            echo "Versuch $i: Landing $A, App $B"
            [ "$A" = 200 ] && [ "$B" != 000 ] && grep -q . <(curl -s "$ZIEL/" | grep -o "Jobbster" | head -1) && { echo "ONLINE: $ZIEL/"; echo "ZIEL=$ZIEL" >> "$GITHUB_ENV"; exit 0; }
            sleep 10
          done
          echo "NICHT ERREICHBAR: GitHub Pages ist vermutlich noch nicht eingeschaltet (Settings → Pages → Branch gh-pages)."
          exit 1
      - name: Rauchtest im Browser (Laptop und Handy)
        if: env.ZIEL != ''
        working-directory: app
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node test/live.mjs "$ZIEL"
